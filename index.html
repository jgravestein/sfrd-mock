<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blue Cross Blue Shield Excellus — SafeRide Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#191A4D;
    --navy-title:#161546;
    --green:#43BE7A;
    --gray-hero:#ECEBE9;
    --rust:#BE4127;
    --white:#ffffff;
    --link:#2E3AD6;
    --chat-blue:#3F51E8;
    --ink:#1c1c25;
    --muted:#6b6b78;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Inter",system-ui,sans-serif;
    background:var(--navy);
    color:#fff;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:26px clamp(20px,4vw,64px);
    gap:24px;
  }
  .logo{
    display:flex;
    align-items:center;
    font-family:"Inter";
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.5px;
    position:relative;
  }
  .logo .safe{color:#fff;}
  .logo .health{color:var(--green);margin-left:9px;}
  .logo .underline{
    position:absolute;
    left:0;bottom:-9px;
    height:3px;width:100%;
    background:#fff;
  }
  .logo .node{
    position:absolute;
    right:-14px;bottom:-13px;
    width:11px;height:11px;border-radius:50%;
    border:2.5px solid #fff;background:var(--navy);
  }

  nav{
    display:flex;
    align-items:center;
    gap:clamp(22px,3vw,52px);
  }
  nav a{
    text-decoration:none;
    color:#fff;
    font-size:19px;
    font-weight:400;
    white-space:nowrap;
    opacity:.95;
    transition:opacity .15s ease;
  }
  nav a:hover{opacity:.65;}

  .burger{
    display:flex;flex-direction:column;gap:6px;
    background:none;border:0;cursor:pointer;padding:4px;
  }
  .burger span{width:34px;height:2.5px;background:#fff;display:block;}

  /* ---------- Hero ---------- */
  .hero-wrap{position:relative;}
  .hero{
    background:var(--gray-hero);
    padding:96px 24px 150px;
    text-align:center;
    position:relative;
    z-index:2;
  }
  .hero h1{
    margin:0 auto;
    max-width:1000px;
    color:var(--navy-title);
    font-family:"Lora",serif;
    font-weight:700;
    font-size:clamp(48px,7.6vw,118px);
    line-height:1.02;
    letter-spacing:-1px;
  }

  /* route-line signature */
  .route{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    z-index:1;
    pointer-events:none;
    overflow:visible;
  }

  /* ---------- Body / cards ---------- */
  .content{
    background:var(--navy);
    padding:70px clamp(20px,4vw,64px) 120px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:44px;
  }
  .card{
    background:#fff;
    color:var(--ink);
    border-radius:6px;
    width:min(1880px,94%);
    box-shadow:0 24px 60px rgba(0,0,0,.28);
  }

  /* chat card */
  .chat-card{
    position:relative;
    overflow:hidden;
    border-radius:12px;
    border-bottom:3px solid var(--chat-blue);
    width:min(460px,94%);
    height:640px;
    padding:0;
    background:#fff;
  }
  #cognigyFrame{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }
  .chat-loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6b6b78;
    font-size:15px;
  }
  .chat-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 26px;
    border-bottom:1px solid #ededf0;
  }
  .chat-title{
    display:flex;align-items:center;gap:12px;
    font-weight:700;font-size:20px;color:#111;
  }
  .ai-badge{
    width:34px;height:34px;border-radius:50%;
    background:var(--chat-blue);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;font-family:"Inter";
  }
  .chat-top .left,.chat-top .right{display:flex;align-items:center;gap:20px;color:#3a3a45;}
  .chat-top button{background:none;border:0;cursor:pointer;color:#3a3a45;font-size:22px;line-height:1;padding:2px;}
  .icon-back{font-size:26px;font-weight:600;}

  .chat-body{
    flex:1;
    overflow-y:auto;
    padding:22px 30px;
    display:flex;flex-direction:column;gap:20px;
  }
  .chat-disclaimer{
    text-align:center;color:#8a8a93;font-size:15px;margin:2px 0 8px;
  }
  .msg{display:flex;gap:12px;max-width:78%;}
  .msg .avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:var(--chat-blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
  }
  .msg .meta{font-size:13px;color:#8a8a93;margin-bottom:6px;}
  .msg .meta b{color:#333;font-weight:600;margin-right:6px;}
  .msg .bubble{color:#222;font-size:16px;line-height:1.5;}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg.user .bubble{
    background:var(--chat-blue);color:#fff;
    padding:10px 15px;border-radius:14px 14px 2px 14px;
  }
  .chat-input{
    border-top:1px solid #ededf0;
    display:flex;align-items:center;gap:12px;
    padding:16px 26px;
  }
  .chat-input input{
    flex:1;border:0;outline:0;font-size:17px;color:#222;background:transparent;
    font-family:"Inter";
  }
  .chat-input input::placeholder{color:#9a9aa2;}
  .send{background:none;border:0;cursor:pointer;color:#7d7d88;padding:4px;display:flex;}
  .send:hover{color:var(--chat-blue);}
  .chat-foot{
    text-align:center;font-size:12px;color:#555;font-weight:700;
    padding:8px 0 12px;letter-spacing:.2px;
  }

  /* heading above chat */
  .chat-heading{
    font-family:"Lora",serif;
    font-weight:700;
    color:#fff;
    text-align:center;
    font-size:clamp(30px,3.6vw,50px);
    line-height:1.08;
    letter-spacing:-0.5px;
    margin:0;
    max-width:820px;
  }

  /* inline embedded chat */
  .chat-embed{
    width:min(460px,94%);
    height:640px;
    border:0;
  }

  /* phone block (moved down) — small, subtle, centered */
  .phone-card{
    text-align:center;
    margin-top:-8px;
  }
  .phone-subtitle{
    color:rgba(255,255,255,.7);
    font-size:16px;
    font-weight:400;
    margin:0 0 8px;
  }
  .phone-card a{
    color:#fff;
    text-decoration:underline;
    text-underline-offset:4px;
    text-decoration-color:rgba(255,255,255,.4);
    font-size:20px;
    font-weight:600;
    transition:text-decoration-color .15s ease;
  }
  .phone-card a:hover{text-decoration-color:#fff;}

  @media (max-width:900px){
    nav a:not(.cta){display:none;}
    .chat-card{height:560px;}
  }
  @media (max-width:560px){
    nav{gap:18px;}
    .chat-card{height:70vh;}
    .msg{max-width:90%;}
  }
